<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">Apache James im TCP/IP- und OSI-Modell</title>
  <desc id="desc">Schichtenmodell mit den James-Anwendungsprotokollen SMTP, LMTP, IMAP, POP3, ManageSieve, JMAP und WebAdmin über TLS, TCP, IP und dem Netzzugang. DNS ist als externe Abhängigkeit eingezeichnet.</desc>
  <defs>
    <marker id="ajps-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#286983"/>
    </marker>
  </defs>
  <style>
    .link { cursor: pointer; }
    .link .hit, .link .label { transition: fill .18s ease, stroke .18s ease, stroke-width .18s ease; }
    .link:hover .hit, .link:focus .hit { fill: #dcebf0; stroke: #286983; stroke-width: 2; }
    .link:hover .label, .link:focus .label { fill: #1f566b; }
    .link:focus { outline: none; }
    .link:focus .hit { stroke-width: 3; }
  </style>
  <rect width="1120" height="720" rx="18" fill="#faf7f2"/>
  <text x="32" y="42" font-size="13" font-weight="700" letter-spacing="1.6" fill="#757087">APACHE JAMES · PROTOKOLL- UND SCHICHTENMODELL</text>
  <text x="32" y="68" font-size="12" fill="#757087">OSI links · TCP/IP-Mapping in der Mitte · typische Endpunkte rechts</text>

  <rect x="28" y="92" width="840" height="230" rx="12" fill="#fff" stroke="#d9d4cc"/>
  <rect x="28" y="92" width="116" height="230" rx="12" fill="#f2eee7" stroke="#d9d4cc"/>
  <text x="86" y="123" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#757087">OSI 7</text>
  <text x="86" y="146" text-anchor="middle" font-size="13" font-weight="650" fill="#222">ANWENDUNG</text>
  <text x="86" y="173" text-anchor="middle" font-size="10.5" fill="#757087">Mailtransport</text>
  <text x="86" y="190" text-anchor="middle" font-size="10.5" fill="#757087">Postfachzugriff</text>
  <text x="86" y="207" text-anchor="middle" font-size="10.5" fill="#757087">Administration</text>

  <text x="164" y="119" font-size="10.5" font-weight="700" letter-spacing="1" fill="#757087">JAMES-PROTOKOLLFRONTENDS</text>
  <a href="/kb/smtp" target="_top" class="link" aria-label="KB-Artikel zu SMTP öffnen">
    <rect class="hit" x="164" y="136" width="210" height="74" rx="9" fill="#e9f2f5" stroke="#286983"/>
    <text class="label" x="269" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#1f566b">SMTP · LMTP</text>
    <text class="label" x="269" y="181" text-anchor="middle" font-size="11" fill="#395f6d">Transfer, Relay, Submission</text>
    <text x="269" y="199" text-anchor="middle" font-size="10.5" fill="#757087">25 · 587 · 465 · LMTP konfigurierbar</text>
  </a>
  <a href="https://james.apache.org/server/feature-protocols.html" target="_top" class="link" aria-label="Apache-Dokumentation zu IMAP und POP3 öffnen">
    <rect class="hit" x="390" y="136" width="210" height="74" rx="9" fill="#fff" stroke="#d9d4cc"/>
    <text class="label" x="495" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#222">IMAP · POP3</text>
    <text x="495" y="181" text-anchor="middle" font-size="11" fill="#757087">Mailbox-Zugriff</text>
    <text x="495" y="199" text-anchor="middle" font-size="10.5" fill="#757087">143/993 · 110/995</text>
  </a>
  <a href="https://james.apache.org/server/feature-protocols.html" target="_top" class="link" aria-label="Apache-Dokumentation zu JMAP und WebAdmin öffnen">
    <rect class="hit" x="616" y="136" width="228" height="74" rx="9" fill="#fff" stroke="#d9d4cc"/>
    <text class="label" x="730" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#222">JMAP · WebAdmin</text>
    <text x="730" y="181" text-anchor="middle" font-size="11" fill="#757087">HTTP-APIs</text>
    <text x="730" y="199" text-anchor="middle" font-size="10.5" fill="#757087">typisch HTTPS/443</text>
  </a>
  <a href="https://datatracker.ietf.org/doc/html/rfc5804" target="_top" class="link" aria-label="IETF-Standard zu ManageSieve öffnen">
    <rect class="hit" x="164" y="226" width="210" height="72" rx="9" fill="#fff" stroke="#d9d4cc"/>
    <text class="label" x="269" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#222">ManageSieve</text>
    <text x="269" y="273" text-anchor="middle" font-size="11" fill="#757087">Filterregeln · Port 4190</text>
  </a>
  <a href="/kb/mail-auth" target="_top" class="link" aria-label="KB-Artikel zu SPF, DKIM und DMARC öffnen">
    <rect class="hit" x="390" y="226" width="454" height="72" rx="9" fill="#fff" stroke="#d9d4cc" stroke-dasharray="6 4"/>
    <text class="label" x="617" y="251" text-anchor="middle" font-size="13" font-weight="650" fill="#222">MIME · Sieve · SPF · DKIM</text>
    <text x="617" y="273" text-anchor="middle" font-size="11" fill="#757087">Anwendungslogik und Bibliotheken, keine eigene Netzwerkschicht</text>
  </a>

  <a href="/kb/tls" target="_top" class="link" aria-label="KB-Artikel zu TLS öffnen">
  <rect class="hit" x="28" y="338" width="840" height="88" rx="12" fill="#fff" stroke="#d9d4cc"/>
  <rect x="28" y="338" width="116" height="88" rx="12" fill="#f2eee7" stroke="#d9d4cc"/>
  <text x="86" y="373" text-anchor="middle" font-size="11" font-weight="700" fill="#757087">ZWISCHEN</text>
  <text x="86" y="393" text-anchor="middle" font-size="11" font-weight="700" fill="#757087">OSI 7 UND 4</text>
  <text class="label" x="164" y="370" font-size="14" font-weight="700" fill="#222">TLS</text>
  <text x="164" y="394" font-size="11.5" fill="#757087">implizit verschlüsselt oder als StartTLS-Upgrade · Zertifikat, SNI, Cipher, Client-Authentisierung</text>
  <rect x="744" y="359" width="100" height="28" rx="14" fill="#7a2f16"/>
  <text x="794" y="378" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">HOP-SCHUTZ</text>
  </a>

  <a href="/kb/tcp" target="_top" class="link" aria-label="KB-Artikel zu TCP öffnen">
  <rect class="hit" x="28" y="442" width="840" height="86" rx="12" fill="#fff" stroke="#d9d4cc"/>
  <rect x="28" y="442" width="116" height="86" rx="12" fill="#f2eee7" stroke="#d9d4cc"/>
  <text x="86" y="477" text-anchor="middle" font-size="11" font-weight="700" fill="#757087">OSI 4</text>
  <text x="86" y="498" text-anchor="middle" font-size="12" font-weight="700" fill="#222">TRANSPORT</text>
  <text class="label" x="164" y="477" font-size="15" font-weight="700" fill="#222">TCP</text>
  <text x="207" y="477" font-size="11.5" fill="#757087">zuverlässiger Byte-Stream · Verbindungszustand · Ports · Retransmits · Backpressure</text>
  <text x="164" y="500" font-size="11" fill="#286983">Admin-Sicht: SYN/SYN-ACK, Listener, Firewall, Timeout, Reset, Queue nach erfolgreichem DATA</text>
  </a>

  <a href="/kb/tcp" target="_top" class="link" aria-label="KB-Artikel zu TCP und IP öffnen">
  <rect class="hit" x="28" y="544" width="840" height="70" rx="12" fill="#fff" stroke="#d9d4cc"/>
  <rect x="28" y="544" width="116" height="70" rx="12" fill="#f2eee7" stroke="#d9d4cc"/>
  <text x="86" y="573" text-anchor="middle" font-size="11" font-weight="700" fill="#757087">OSI 3</text>
  <text x="86" y="594" text-anchor="middle" font-size="12" font-weight="700" fill="#222">NETZ</text>
  <text class="label" x="164" y="574" font-size="15" font-weight="700" fill="#222">IPv4 · IPv6</text>
  <text x="164" y="596" font-size="11.5" fill="#757087">Routing, MTU, Quelladresse, NAT und Reputation</text>
  </a>

  <rect x="28" y="630" width="840" height="62" rx="12" fill="#fff" stroke="#d9d4cc"/>
  <rect x="28" y="630" width="116" height="62" rx="12" fill="#f2eee7" stroke="#d9d4cc"/>
  <text x="86" y="667" text-anchor="middle" font-size="11" font-weight="700" fill="#757087">OSI 1–2</text>
  <text x="164" y="656" font-size="14" font-weight="700" fill="#222">Ethernet · WLAN · virtuelle Netze</text>
  <text x="164" y="677" font-size="11" fill="#757087">Link, VLAN, Load Balancer, Container-Netz und Host-Firewall</text>

  <path d="M844 180 H900" stroke="#286983" stroke-width="1.8" marker-end="url(#ajps-arrow)"/>
  <a href="/kb/dns" target="_top" class="link" aria-label="KB-Artikel zu DNS öffnen">
  <rect class="hit" x="916" y="106" width="176" height="240" rx="12" fill="#fff" stroke="#286983"/>
  <text x="1004" y="136" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#286983">EXTERNE ABHÄNGIGKEIT</text>
  <text class="label" x="1004" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#222">DNS</text>
  <line x1="940" y1="184" x2="1068" y2="184" stroke="#d9d4cc"/>
  <text x="944" y="210" font-size="11.5" font-weight="650" fill="#222">MX</text>
  <text x="982" y="210" font-size="11" fill="#757087">Zustellziel</text>
  <text x="944" y="237" font-size="11.5" font-weight="650" fill="#222">A/AAAA</text>
  <text x="1004" y="237" font-size="11" fill="#757087">Adresse</text>
  <text x="944" y="264" font-size="11.5" font-weight="650" fill="#222">PTR</text>
  <text x="982" y="264" font-size="11" fill="#757087">Identität</text>
  <text x="944" y="291" font-size="11.5" font-weight="650" fill="#222">TXT</text>
  <text x="982" y="291" font-size="11" fill="#757087">SPF/DKIM/DMARC</text>
  <text x="1004" y="324" text-anchor="middle" font-size="10.5" fill="#7a2f16">nicht Teil von James,</text>
  <text x="1004" y="339" text-anchor="middle" font-size="10.5" fill="#7a2f16">aber betriebsentscheidend</text>
  </a>

  <rect x="916" y="366" width="176" height="246" rx="12" fill="#fff" stroke="#d9d4cc"/>
  <text x="1004" y="396" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#757087">ADMIN-PRÜFREIHENFOLGE</text>
  <circle cx="948" cy="430" r="13" fill="#286983"/><text x="948" y="434" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">1</text>
  <text x="972" y="434" font-size="11" fill="#222">DNS und Route</text>
  <circle cx="948" cy="469" r="13" fill="#286983"/><text x="948" y="473" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">2</text>
  <text x="972" y="473" font-size="11" fill="#222">TCP-Handshake</text>
  <circle cx="948" cy="508" r="13" fill="#286983"/><text x="948" y="512" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">3</text>
  <text x="972" y="512" font-size="11" fill="#222">TLS-Vertrauen</text>
  <circle cx="948" cy="547" r="13" fill="#286983"/><text x="948" y="551" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">4</text>
  <text x="972" y="551" font-size="11" fill="#222">Protokollcode</text>
  <circle cx="948" cy="586" r="13" fill="#7a2f16"/><text x="948" y="590" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">5</text>
  <text x="972" y="590" font-size="11" fill="#222">James-Pipeline</text>

  <text x="916" y="680" font-size="10.5" fill="#757087">TLS ist eine Sicherheitsschicht über TCP, keine eigene OSI-Schicht.</text>
</svg>
