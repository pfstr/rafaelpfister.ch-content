    <title>Anwendung und Stub Resolver im Artikel öffnen</title>
    <rect class="blue hit" x="70" y="178" width="245" height="92" rx="15"/>
    <text class="label" x="92" y="211">Anwendung</text>
    <text class="body" x="92" y="239">Stub Resolver</text>
    <text class="mono" x="92" y="260">QNAME · QTYPE</text>
