<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">DNS-Auflösung, Delegation, Cache und DNSSEC</title>
  <desc id="desc">Interaktive Darstellung des RFC-definierten Wegs von Anwendung und Stub Resolver über rekursiven Resolver und Cache zu Root, TLD und autoritativer Zone. Zusätzliche Blöcke zeigen DNSSEC-Vertrauenskette und wichtige Diagnosesignale. Alle fachlichen Blöcke führen zum Artikel oder zur Primärquelle.</desc>
  <style>
    :root { color-scheme: light; }
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #151515; }
    .bg { fill: #faf7f2; }
    .panel { fill: #fff; stroke: #d8d2c9; stroke-width: 2; }
    .soft { fill: #f2eee8; stroke: #d8d2c9; stroke-width: 2; }
    .blue { fill: #e6f1f4; stroke: #26748f; stroke-width: 2; }
    .green { fill: #edf4ed; stroke: #4d7450; stroke-width: 2; }
    .rose { fill: #f8ece8; stroke: #8f371b; stroke-width: 2; }
    .gold { fill: #f8f1dd; stroke: #9a6d12; stroke-width: 2; }
    .kicker { font-size: 17px; letter-spacing: 2.1px; font-weight: 700; fill: #6e667b; }
    .h1 { font-size: 34px; font-weight: 760; }
    .h2 { font-size: 22px; font-weight: 740; }
    .label { font-size: 18px; font-weight: 720; }
    .body { font-size: 15px; fill: #55505e; }
    .small { font-size: 13px; fill: #6e667b; }
    .mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 14px; font-weight: 700; }
    .arrow { stroke: #242424; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .arrow-blue { stroke: #26748f; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
    .arrow-gold { stroke: #9a6d12; stroke-width: 3; fill: none; marker-end: url(#arrowGold); }
    .return { stroke: #4d7450; stroke-width: 3; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowGreen); }
    a { outline: none; cursor: pointer; }
    a .hit, a .risk, a .source { transition: fill .16s ease, stroke .16s ease, filter .16s ease; }
    a:hover .hit, a:focus .hit { fill: #d7eaf0; stroke: #0f607c; filter: drop-shadow(0 4px 6px rgba(15,96,124,.18)); }
    a:hover .risk, a:focus .risk { fill: #f3dcd4; stroke: #7c2e16; filter: drop-shadow(0 4px 6px rgba(124,46,22,.14)); }
    a:hover .source, a:focus .source { fill: #e1eff3; stroke: #26748f; }
    a:focus .hit, a:focus .risk, a:focus .source { stroke-width: 4; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#242424"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#26748f"/></marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#9a6d12"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#4d7450"/></marker>
  </defs>

  <rect class="bg" width="1400" height="940"/>
  <text class="kicker" x="46" y="46">DNS · AUFLÖSUNG · DELEGATION · CACHE · DNSSEC</text>
  <text class="h1" x="46" y="86">Wer weiss was – und welche Antwort sieht der Client?</text>

  <rect class="panel" x="40" y="115" width="1320" height="438" rx="20"/>
  <text class="kicker" x="70" y="151">REKURSIVE ANFRAGE UND ITERATIVE AUFLÖSUNG</text>

