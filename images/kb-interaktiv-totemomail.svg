<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Totemomail und Kiteworks EPG: Mailflow, Schutzverfahren und Plattformwechsel</title>
  <desc id="desc">Interaktive Admin-Grafik mit SMTP-Mailflow, Policy, S/MIME, OpenPGP, TLS, WebMail, Schlüsselbestand, Legacy-Totemomail, Datenmigration, Kiteworks EPG, Monitoring und Recovery.</desc>
