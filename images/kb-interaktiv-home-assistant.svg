    <style>
      :root{color-scheme:light} text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#162536}.title{font-size:28px;font-weight:750;letter-spacing:.4px}.subtitle{font-size:15px;fill:#536274}.band-title{font-size:15px;font-weight:750;letter-spacing:1.6px;fill:#5b6077}.box rect{stroke-width:1.7;rx:16;filter:url(#shadow);transition:fill .16s ease,stroke .16s ease,transform .16s ease}.box text{pointer-events:none;text-anchor:middle}.box .name{font-size:16px;font-weight:750}.box .small{font-size:12.5px;fill:#526375}.edge{fill:none;stroke:#8795a3;stroke-width:2;marker-end:url(#arrow)}.join{fill:none;stroke:#8795a3;stroke-width:2}.bus{fill:none;stroke:#2c718e;stroke-width:4}.source rect{fill:#f7efe9;stroke:#a5522b}.core rect{fill:#e7f3f7;stroke:#1f718f}.data rect{fill:#f0edf8;stroke:#6c55a3}.runtime rect{fill:#edf5ec;stroke:#49805a}.security rect{fill:#fff4dd;stroke:#a06b14}.box:hover rect,.box:focus rect{fill:#fff0b8;stroke:#9a5b00;transform:translateY(-3px)}.box:focus{outline:none}.box:focus rect{stroke-width:3}.label{font-size:12px;fill:#617080}.note{font-size:12.5px;fill:#596879}.rule{stroke:#d4d8dc;stroke-width:1}
    </style>
