<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
  <title id="title">Home Assistant: Datenpfade, Core, Persistenz und Betrieb</title>
  <desc id="desc">Klickbare Architekturkarte von lokalen Geräten, Cloud-APIs, Discovery, MQTT und Funkbrücken über Integrationen, Registries, Event Bus, State Machine, Service Registry und Automationen bis zu Recorder, APIs, Laufzeit, Monitoring, Backup und Restore.</desc>
