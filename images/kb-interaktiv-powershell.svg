<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">PowerShell-Laufzeit, Vertrauensgrenzen und kontrollierte Administration</title>
  <desc id="desc">Klickbare Architekturkarte von Host, Engine, Runspace und Objektpipeline über Module, Provider und Produkt-APIs zu WSMan- und SSH-Remoting, JEA, Serialisierung sowie dem administrativen Regelkreis aus Ermitteln, Planen, Ändern, Verifizieren und Protokollieren.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6d7586"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1d2940" flood-opacity=".12"/>
    </filter>
    <style>
      .bg{fill:#faf7f1}.panel{fill:#fff;stroke:#d9d3c8;stroke-width:2}.band{fill:#f0ece4}
      .hit{fill:#edf5f7;stroke:#26718c;stroke-width:2;transition:fill .18s ease,stroke .18s ease,transform .18s ease}
      .hit-warm{fill:#f8eee7;stroke:#934022;stroke-width:2;transition:fill .18s ease,stroke .18s ease}
      .hit-dark{fill:#e8ebf3;stroke:#4a587b;stroke-width:2;transition:fill .18s ease,stroke .18s ease}
      .hit-green{fill:#edf4ec;stroke:#4f7655;stroke-width:2;transition:fill .18s ease,stroke .18s ease}
      a:hover .hit,a:focus .hit{fill:#cde8ef;stroke:#0b5e7a}
      a:hover .hit-warm,a:focus .hit-warm{fill:#f3d8c8;stroke:#7b2c10}
      a:hover .hit-dark,a:focus .hit-dark{fill:#d7ddec;stroke:#334267}
      a:hover .hit-green,a:focus .hit-green{fill:#d7ead7;stroke:#365d3d}
      a:focus{outline:none}a:focus rect{stroke-width:4}
      .kicker{font:700 15px system-ui,sans-serif;letter-spacing:1.8px;fill:#6d6b7d}
      .title{font:800 30px system-ui,sans-serif;fill:#142238}.sub{font:400 17px system-ui,sans-serif;fill:#59657a}
      .label{font:700 18px system-ui,sans-serif;fill:#142238}.small{font:400 14px system-ui,sans-serif;fill:#536176}
      .tiny{font:600 13px system-ui,sans-serif;fill:#536176}.arrow{stroke:#6d7586;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#8d95a4;stroke-width:2;stroke-dasharray:7 7;fill:none}
