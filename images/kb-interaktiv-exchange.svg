<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Exchange: Transport, Postfachzustand und Hybridgrenzen</title>
  <desc id="desc">Interaktive Admin-Grafik mit Exchange-Transport-Pipeline, Clientzugriff, ESE-Mailboxdatenbank, DAG, Exchange Online und Hybrid. Jeder Block verlinkt zur Erklärung oder Primärquelle.</desc>
  <style>
