    .arrow { fill: none; stroke: #26748f; stroke-width: 4; marker-end: url(#arrow); }
    .arrow.gold { stroke: #987126; marker-end: url(#arrowGold); }
    .arrow.dashed { stroke: #8b8791; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrowGrey); }
