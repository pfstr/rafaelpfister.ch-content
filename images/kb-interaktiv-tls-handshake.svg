    <rect class="rose risk" x="570" y="836" width="245" height="82" rx="15"/>
    <text class="label" x="592" y="867">Unknown Issuer</text>
    <text class="body" x="592" y="893">Intermediate · Truststore</text>
  </a>
  <a href="https://datatracker.ietf.org/doc/html/rfc9525" target="_top" tabindex="0">
    <title>RFC 9525: Hostname- und Identitätsprüfung</title>
    <rect class="rose risk" x="835" y="836" width="245" height="82" rx="15"/>
    <text class="label" x="857" y="867">Hostname Mismatch</text>
    <text class="body" x="857" y="893">Referenz-ID passt nicht zum SAN</text>
