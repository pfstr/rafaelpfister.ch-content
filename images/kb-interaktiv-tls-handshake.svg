<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">TLS-1.3-Handshake und Zertifikatsprüfung</title>
  <desc id="desc">Interaktive Darstellung des TLS-1.3-Handshakes von ClientHello und ServerHello über Zertifikat und Finished bis zu geschützten Anwendungsdaten. Ein zweiter Bereich trennt gesendete Zertifikatskette, lokalen Trust Anchor und Dienstidentitätsprüfung. Alle fachlichen Blöcke führen zum Artikel oder zu Primärquellen.</desc>
  <style>
    :root { color-scheme: light; }
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #151515; }
    .bg { fill: #faf7f2; }
    .panel { fill: #fff; stroke: #d8d2c9; stroke-width: 2; }
    .soft { fill: #f2eee8; stroke: #d8d2c9; stroke-width: 2; }
    .blue { fill: #e6f1f4; stroke: #26748f; stroke-width: 2; }
    .green { fill: #edf4ed; stroke: #4d7450; stroke-width: 2; }
    .rose { fill: #f8ece8; stroke: #8f371b; stroke-width: 2; }
    .gold { fill: #f8f1dd; stroke: #9a6d12; stroke-width: 2; }
    .violet { fill: #f1edf6; stroke: #6e567e; stroke-width: 2; }
    .kicker { font-size: 17px; letter-spacing: 2.1px; font-weight: 700; fill: #6e667b; }
    .h1 { font-size: 34px; font-weight: 760; }
    .label { font-size: 18px; font-weight: 720; }
    .body { font-size: 15px; fill: #55505e; }
    .small { font-size: 13px; fill: #6e667b; }
    .mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 14px; font-weight: 700; }
    .arrow { stroke: #242424; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .arrow-blue { stroke: #26748f; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
    .arrow-gold { stroke: #9a6d12; stroke-width: 3; fill: none; marker-end: url(#arrowGold); }
    .return { stroke: #4d7450; stroke-width: 3; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowGreen); }
    .lifeline { stroke: #bdb5aa; stroke-width: 2; stroke-dasharray: 7 8; }
    a { outline: none; cursor: pointer; }
    a .hit, a .risk, a .source { transition: fill .16s ease, stroke .16s ease, filter .16s ease; }
    a:hover .hit, a:focus .hit { fill: #d7eaf0; stroke: #0f607c; filter: drop-shadow(0 4px 6px rgba(15,96,124,.18)); }
    a:hover .risk, a:focus .risk { fill: #f3dcd4; stroke: #7c2e16; filter: drop-shadow(0 4px 6px rgba(124,46,22,.14)); }
    a:hover .source, a:focus .source { fill: #e1eff3; stroke: #26748f; }
    a:focus .hit, a:focus .risk, a:focus .source { stroke-width: 4; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#242424"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#26748f"/></marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#9a6d12"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#4d7450"/></marker>
  </defs>

  <rect class="bg" width="1400" height="980"/>
  <text class="kicker" x="46" y="46">TLS · HANDSHAKE · PKIX · DIENSTIDENTITÄT</text>
  <text class="h1" x="46" y="86">Vom ClientHello zur akzeptierten Dienstidentität</text>

  <rect class="panel" x="40" y="115" width="1320" height="453" rx="20"/>
  <text class="kicker" x="70" y="151">TLS 1.3 · VOLLSTÄNDIGER HANDSHAKE</text>
  <text class="kicker" x="92" y="187">CLIENT</text>
  <text class="kicker" x="1142" y="187">SERVER</text>
  <line class="lifeline" x1="195" y1="200" x2="195" y2="522"/>
  <line class="lifeline" x1="1205" y1="200" x2="1205" y2="522"/>

  <a href="https://datatracker.ietf.org/doc/html/rfc9846#section-4.2.1" target="_top" tabindex="0">
    <title>RFC 9846: ClientHello</title>
    <rect class="blue hit" x="70" y="207" width="340" height="92" rx="15"/>
    <text class="label" x="92" y="239">1 · ClientHello</text>
    <text class="body" x="92" y="266">Versionen · Cipher · Gruppen · SNI</text>
    <text class="mono" x="92" y="289">key_share · signature_algorithms</text>
  </a>
  <path class="arrow-blue" d="M410 253 H1150"/>

  <a href="https://datatracker.ietf.org/doc/html/rfc9846#section-4.2.3" target="_top" tabindex="0">
    <title>RFC 9846: ServerHello und Schlüsselauswahl</title>
    <rect class="blue hit" x="990" y="310" width="340" height="92" rx="15"/>
    <text class="label" x="1012" y="342">2 · ServerHello</text>
    <text class="body" x="1012" y="369">Auswahl + ephemerer Key Share</text>
    <text class="mono" x="1012" y="392">→ Handshake Traffic Secrets</text>
  </a>
  <path class="arrow-blue" d="M990 356 H250"/>

  <a href="https://datatracker.ietf.org/doc/html/rfc9846#section-2" target="_top" tabindex="0">
    <title>RFC 9846: Verschlüsselte Serverparameter und Authentisierung</title>
    <rect class="violet hit" x="490" y="310" width="440" height="92" rx="15"/>
    <text class="label" x="512" y="342">3 · Verschlüsselte Server Flight</text>
    <text class="body" x="512" y="369">EncryptedExtensions · Certificate</text>
    <text class="mono" x="512" y="392">CertificateVerify · Finished</text>
  </a>

  <a href="/kb/tls#zertifikatspfad-und-trust-boundary" target="_top" tabindex="0">
    <title>Zertifikatspfad und lokale Trust Boundary im Artikel öffnen</title>
    <rect class="gold hit" x="70" y="413" width="340" height="92" rx="15"/>
    <text class="label" x="92" y="445">4 · Client validiert lokal</text>
    <text class="body" x="92" y="472">Pfad · SAN · Zeit · EKU · Policy</text>
    <text class="mono" x="92" y="495">Trust Anchor kommt nicht vom Server</text>
  </a>
  <path class="arrow-gold" d="M490 356 H430 V459 H410"/>

  <a href="https://datatracker.ietf.org/doc/html/rfc9846#section-4.5.3" target="_top" tabindex="0">
    <title>RFC 9846: Finished und Key Confirmation</title>
    <rect class="green hit" x="490" y="431" width="340" height="74" rx="15"/>
    <text class="label" x="512" y="461">5 · Client Finished</text>
    <text class="body" x="512" y="487">Transkript + Schlüssel bestätigt</text>
  </a>
  <path class="arrow-blue" d="M830 468 H1150"/>

  <a href="/kb/tls#schlüsselplan-und-record-layer" target="_top" tabindex="0">
    <title>Schlüsselplan und geschützte Anwendungsdaten im Artikel öffnen</title>
    <rect class="green hit" x="890" y="431" width="440" height="74" rx="15"/>
    <text class="label" x="912" y="461">6 · Geschützte Anwendungsdaten</text>
    <text class="body" x="912" y="487">getrennte Client-/Server-Traffic-Secrets · AEAD</text>
  </a>
  <path class="return" d="M1205 522 H195"/>

  <rect class="panel" x="40" y="588" width="1320" height="189" rx="20"/>
  <text class="kicker" x="70" y="623">ZERTIFIKATSPFAD UND DIENSTIDENTITÄT · SERVER LIEFERT NICHT DAS VERTRAUEN</text>
  <a href="/kb/tls#x509-zertifikat-und-privater-schlüssel" target="_top" tabindex="0">
    <title>X.509-Leaf-Zertifikat im Artikel öffnen</title>
    <rect class="blue hit" x="70" y="644" width="215" height="92" rx="14"/>
    <text class="label" x="92" y="676">Leaf</text>
    <text class="body" x="92" y="701">SAN · Public Key</text>
    <text class="mono" x="92" y="724">serverAuth</text>
  </a>
  <path class="arrow" d="M285 690 H335"/>
  <a href="https://datatracker.ietf.org/doc/html/rfc5280#section-6" target="_top" tabindex="0">
    <title>RFC 5280: Intermediate-Zertifikate und Pfadvalidierung</title>
    <rect class="soft hit" x="335" y="644" width="215" height="92" rx="14"/>
    <text class="label" x="357" y="676">Intermediate</text>
    <text class="body" x="357" y="701">CA=TRUE · Signatur</text>
    <text class="mono" x="357" y="724">Path Length</text>
  </a>
  <path class="arrow-gold" d="M550 690 H600"/>
  <a href="/kb/tls#zertifikatspfad-und-trust-boundary" target="_top" tabindex="0">
    <title>Lokaler Trust Anchor und Truststore im Artikel öffnen</title>
    <rect class="gold hit" x="600" y="644" width="215" height="92" rx="14"/>
    <text class="label" x="622" y="676">Trust Anchor</text>
    <text class="body" x="622" y="701">lokaler Truststore</text>
    <text class="mono" x="622" y="724">Windows · Java · Bundle</text>
  </a>
  <path class="arrow-gold" d="M815 690 H865"/>
  <a href="https://datatracker.ietf.org/doc/html/rfc9525#section-6" target="_top" tabindex="0">
    <title>RFC 9525: Referenzidentität gegen subjectAltName prüfen</title>
    <rect class="violet hit" x="865" y="644" width="215" height="92" rx="14"/>
    <text class="label" x="887" y="676">Service Identity</text>
    <text class="body" x="887" y="701">Referenz-ID ↔ SAN</text>
    <text class="mono" x="887" y="724">CN nicht verwenden</text>
  </a>
  <path class="arrow-blue" d="M1080 690 H1130"/>
  <a href="/kb/tls#dienstidentität-san-referenz-id-und-sni" target="_top" tabindex="0">
    <title>SAN, Referenz-ID und SNI im Artikel öffnen</title>
    <rect class="green hit" x="1130" y="644" width="200" height="92" rx="14"/>
    <text class="label" x="1152" y="676">Akzeptieren?</text>
    <text class="body" x="1152" y="701">Pfad + Name + Policy</text>
    <text class="mono" x="1152" y="724">oder TLS Alert</text>
  </a>

  <text class="kicker" x="46" y="816">ADMIN-SIGNALE · KLICK FÜHRT ZUR ERKLÄRUNG ODER PRIMÄRQUELLE</text>
  <a href="/kb/tls#fehlerbild-einer-systemgrenze-zuordnen" target="_top" tabindex="0">
