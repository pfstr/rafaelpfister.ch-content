  <a href="/kb/storage#snapshots-und-clones" tabindex="0" aria-label="Snapshots und Clones"><rect class="hit model" x="450" y="495" width="105" height="76" rx="12"/><text class="t label" x="502" y="525">Snap</text><text class="t sub" x="502" y="548">CoW · Clone</text></a>
