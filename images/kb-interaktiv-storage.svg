<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Storage-Datenpfad, Semantik und Recovery</title>
  <desc id="desc">Interaktive Übersicht über Anwendung, Cache, Dateisystem, Volume, Controller, Medium, Block-, Datei- und Objektspeicher, Konsistenz, Integrität und Wiederherstellung.</desc>
  <style>:root{color-scheme:light}.bg{fill:#faf8f4}.panel{fill:#fff;stroke:#d8d1c8;stroke-width:2}.head{fill:#f1ede7}.hit{fill:#edf5f7;stroke:#24738e;stroke-width:1.8;transition:fill .16s ease,stroke .16s ease}.hit.model{fill:#f7f1ec;stroke:#8b3518}.hit.sem{fill:#f2f5ea;stroke:#55743a}.hit.ops{fill:#f1eff8;stroke:#6752a1}.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#111827}.ey{font-size:16px;font-weight:700;letter-spacing:2px;fill:#687086}.h1{font-size:30px;font-weight:750}.h2{font-size:17px;font-weight:750;letter-spacing:1.25px}.label{font-size:15.5px;font-weight:750;text-anchor:middle}.sub{font-size:12px;text-anchor:middle;fill:#526673}.note{font-size:13px;fill:#65717a}.arrow{stroke:#7f8c93;stroke-width:2;fill:none;marker-end:url(#arr)}a{text-decoration:none;outline:none}a:hover .hit,a:focus .hit{fill:#d4edf5;stroke:#075f7d;stroke-width:3}a:hover .hit.model,a:focus .hit.model{fill:#f8dfd2;stroke:#7a270e}a:hover .hit.sem,a:focus .hit.sem{fill:#dfeccd;stroke:#365a1d}a:hover .hit.ops,a:focus .hit.ops{fill:#e2dcf7;stroke:#4c3789}a:focus .hit{filter:url(#focus)}.pill{fill:#1f6f89}.pilltext{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}</style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7f8c93"/></marker><filter id="focus" x="-12%" y="-20%" width="124%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#24738e" flood-opacity=".45"/></filter></defs>
  <rect class="bg" width="1400" height="1000"/>
  <text class="t ey" x="40" y="38">ADMIN-KARTE · DATENPFAD, COMMITZUSAGE UND FEHLERDOMÄNEN</text>
  <text class="t h1" x="40" y="76">Bestätigte Bytes sind eine End-to-End-Zusage</text>
  <rect class="pill" x="1174" y="33" width="186" height="34" rx="17"/><text class="t pilltext" x="1267" y="55">28 VERLINKTE BLÖCKE</text>
  <rect class="panel" x="30" y="100" width="1340" height="205" rx="20"/><path class="head" d="M50 100h1300a20 20 0 0 1 20 20v35H30v-35a20 20 0 0 1 20-20z"/>
  <text class="t h2" x="55" y="136">1 · SCHREIBPFAD — JEDE SCHICHT KANN PUFFERN, BESTÄTIGEN ODER FEHLER VERBERGEN</text>
  <path class="arrow" d="M221 220H233M407 220H419M593 220H605M779 220H791M965 220H977M1151 220H1163"/>
