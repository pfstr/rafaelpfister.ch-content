  <a href="https://man7.org/linux/man-pages/man2/fsync.2.html" tabindex="0" aria-label="fsync und Commit"><rect class="hit sem" x="730" y="405" width="190" height="76" rx="12"/><text class="t label" x="825" y="435">Commit</text><text class="t sub" x="825" y="458">fsync · Flush · FUA</text></a>
