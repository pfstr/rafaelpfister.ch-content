  <text class="eyebrow" x="36" y="42">MIGRATION · ARCHITEKTUR, DATENHOHEIT UND KONTROLLIERTER CUTOVER</text>
  <text class="title" x="36" y="82">Jeder Übergang braucht eine eindeutige Schreib- und Mailverantwortung</text>
