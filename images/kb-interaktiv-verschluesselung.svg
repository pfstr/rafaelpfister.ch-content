<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">E-Mail-Verschlüsselung: Schutzmodelle, Klartextgrenzen und Schlüsselzustand</title>
  <desc id="desc">Interaktive Übersicht von Transport-TLS, Client-zu-Client S/MIME und OpenPGP, Gateway-zu-Gateway, Portalzustellung, Metadaten sowie Schlüssel- und Recoverygrenzen.</desc>
  <style>
    :root { color-scheme: light; }
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #101828; }
    .eyebrow { font-size: 16px; font-weight: 800; letter-spacing: 2px; fill: #667085; }
    .title { font-size: 30px; font-weight: 800; }
    .subtitle { font-size: 15px; fill: #475467; }
    .section { font-size: 15px; font-weight: 800; letter-spacing: 1.3px; fill: #667085; }
    .label { font-size: 19px; font-weight: 800; }
    .body { font-size: 15px; fill: #344054; }
    .small { font-size: 13px; fill: #475467; }
    .arrow { stroke: #28718c; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .arrow-red { stroke: #8b3a1b; stroke-width: 3; fill: none; stroke-dasharray: 9 7; marker-end: url(#arrowRed); }
    .frame { fill: #fff; stroke: #d8d2c8; stroke-width: 2; }
    .hit { fill: #f7f4ee; stroke: #cfc7ba; stroke-width: 2; transition: fill .18s ease, stroke .18s ease, transform .18s ease; transform-box: fill-box; transform-origin: center; }
    .hit-blue { fill: #e8f3f7; stroke: #28718c; }
    .hit-red { fill: #f8ece6; stroke: #8b3a1b; }
    .hit-green { fill: #eaf5ef; stroke: #3b7d5b; }
    .chip { fill: #f7f4ee; stroke: #cfc7ba; stroke-width: 1.5; transition: fill .18s ease, stroke .18s ease; }
    a { cursor: pointer; outline: none; }
    a:hover .hit, a:focus .hit { fill: #d9edf4; stroke: #0d6a8a; transform: translateY(-3px); }
    a:hover .hit-red, a:focus .hit-red { fill: #f3d8cc; stroke: #7a2d12; }
    a:hover .hit-green, a:focus .hit-green { fill: #d5ecdf; stroke: #246844; }
    a:hover .chip, a:focus .chip { fill: #d9edf4; stroke: #0d6a8a; }
    a:hover text, a:focus text { fill: #064c66; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#28718c"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b3a1b"/></marker>
  </defs>
  <rect width="1400" height="1000" fill="#fbfaf7"/>
  <text class="eyebrow" x="36" y="42">E-MAIL-VERSCHLÜSSELUNG · KLARTEXT, SCHLÜSSEL UND ZUSTAND</text>
  <text class="title" x="36" y="82">Das Verfahren allein verrät nicht, wo eine Nachricht lesbar ist</text>
  <text class="subtitle" x="36" y="110">Jeder klickbare Block führt zum zugehörigen Betriebsmodell, Standard oder Admin-Nachweis</text>

  <rect class="frame" x="28" y="138" width="1344" height="520" rx="22"/>
  <text class="section" x="52" y="171">VIER SCHUTZMODELLE · UNTERSCHIEDLICHE KRYPTOGRAFISCHE ENDPUNKTE</text>

  <a href="/kb/verschluesselung#smtp-tls-schutz-pro-transporthop" target="_top" tabindex="0">
    <rect class="hit hit-blue" x="52" y="196" width="294" height="124" rx="16"/>
    <text class="label" x="199" y="232" text-anchor="middle">1 · SMTP-TLS</text>
    <text class="body" x="199" y="260" text-anchor="middle">MTA ↔ MTA · ein Hop</text>
    <text class="small" x="199" y="285" text-anchor="middle">Klartext auf jedem Mailserver</text>
    <text class="small" x="199" y="307" text-anchor="middle">Policy: DANE · MTA-STS · REQUIRETLS</text>
  </a>
  <a href="/kb/verschluesselung#smime-cms-x509-und-mime" target="_top" tabindex="0">
    <rect class="hit hit-green" x="386" y="196" width="294" height="124" rx="16"/>
    <text class="label" x="533" y="232" text-anchor="middle">2 · S/MIME</text>
    <text class="body" x="533" y="260" text-anchor="middle">MIME · CMS · X.509/PKIX</text>
    <text class="small" x="533" y="285" text-anchor="middle">Client oder Gateway hält Private Key</text>
    <text class="small" x="533" y="307" text-anchor="middle">SignedData ≠ EnvelopedData</text>
  </a>
  <a href="/kb/verschluesselung#openpgp-format-ist-nicht-vertrauensmodell" target="_top" tabindex="0">
    <rect class="hit hit-green" x="720" y="196" width="294" height="124" rx="16"/>
    <text class="label" x="867" y="232" text-anchor="middle">3 · OpenPGP</text>
    <text class="body" x="867" y="260" text-anchor="middle">Packets · Keys · PGP/MIME</text>
    <text class="small" x="867" y="285" text-anchor="middle">Fingerprint statt kurzer Key ID</text>
    <text class="small" x="867" y="307" text-anchor="middle">Format ≠ Web of Trust</text>
  </a>
  <a href="/kb/verschluesselung#portalzustellung-webanwendung-statt-empfängerschlüssel" target="_top" tabindex="0">
    <rect class="hit hit-red" x="1054" y="196" width="294" height="124" rx="16"/>
    <text class="label" x="1201" y="232" text-anchor="middle">4 · Webportal</text>
    <text class="body" x="1201" y="260" text-anchor="middle">Benachrichtigung · Link · Login</text>
    <text class="small" x="1201" y="285" text-anchor="middle">Inhalt im Portalzustand</text>
    <text class="small" x="1201" y="307" text-anchor="middle">MFA · Retention · sichere Antwort</text>
  </a>

