<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">SEPPmail: SMTP-Pfad, Verschlüsselungsentscheidung und Betriebszustände</title>
  <desc id="desc">Interaktive Admin-Grafik mit SMTP-Annahme, Ruleset, S/MIME, OpenPGP, TLS, GINA, LDAP, Schlüsselbestand, Cluster, Monitoring und Recovery. Jeder Block verlinkt zur Erklärung oder Herstellerquelle.</desc>
  <style>
    :root { color-scheme: light; }
    .bg { fill: #f8f5ef; }
    .panel { fill: #fffdfa; stroke: #d9d2c7; stroke-width: 2; }
    .hit { fill: #e7f1f4; stroke: #26748f; stroke-width: 2; transition: fill .16s ease, stroke .16s ease, filter .16s ease; }
    .hit.gold { fill: #f7edcf; stroke: #987126; }
    .hit.red { fill: #f5e4df; stroke: #93492f; }
    .hit.green { fill: #e5f0e7; stroke: #4f7758; }
    .hit.violet { fill: #ece7f2; stroke: #675578; }
    a:hover .hit, a:focus .hit { fill: #d2e9ee; stroke: #0d5872; filter: drop-shadow(0 5px 7px rgba(23, 69, 84, .22)); }
    a:hover .hit.gold, a:focus .hit.gold { fill: #f2dfad; stroke: #7c5811; }
    a:hover .hit.red, a:focus .hit.red { fill: #f2d8cf; stroke: #743321; }
    a:hover .hit.green, a:focus .hit.green { fill: #dbeadf; stroke: #315f3c; }
    a:hover .hit.violet, a:focus .hit.violet { fill: #e5d9ed; stroke: #59436c; }
    a:focus { outline: none; }
    a:focus .hit { stroke-width: 4; }
    .kicker { font: 700 15px Arial, sans-serif; letter-spacing: 2px; fill: #6b6576; }
    .headline { font: 700 30px Arial, sans-serif; fill: #151515; }
    .section { font: 700 15px Arial, sans-serif; letter-spacing: 1.8px; fill: #6b6576; }
    .label { font: 700 18px Arial, sans-serif; fill: #10212a; }
    .body { font: 400 13px Arial, sans-serif; fill: #4f5960; }
    .mono { font: 700 12px Consolas, monospace; fill: #243841; }
    .small { font: 400 11px Arial, sans-serif; fill: #6b6576; }
    .arrow { fill: none; stroke: #26748f; stroke-width: 4; marker-end: url(#arrow); }
    .arrow.gold { stroke: #987126; marker-end: url(#arrowGold); }
    .arrow.dashed { stroke: #8b8791; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrowGrey); }
    .chip { fill: #f1eee8; stroke: #d3ccc2; stroke-width: 1.5; transition: fill .16s ease, stroke .16s ease; }
    a:hover .chip, a:focus .chip { fill: #d9ebef; stroke: #26748f; }
