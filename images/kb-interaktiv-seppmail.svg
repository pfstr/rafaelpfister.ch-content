  <rect class="panel" x="58" y="428" width="1284" height="252" rx="24"/>
  <text class="section" x="82" y="462">2 · VERFAHREN UND ZUSTAND · «VERSCHLÜSSELT» BRAUCHT EIN KONKRETES OBJEKT</text>

  <a href="/kb/verschluesselung" target="_top" tabindex="0">
