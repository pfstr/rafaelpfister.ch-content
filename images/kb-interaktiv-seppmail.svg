    <rect class="hit gold" x="82" y="184" width="180" height="104" rx="18"/>
    <text class="label" x="104" y="218">Internet / MX</text>
    <text class="body" x="104" y="244">DNS · Smarthost · Peer</text>
    <text class="mono" x="104" y="268">Name → erster Hop</text>
  </a>
  <path class="arrow" d="M262 236 H304"/>

