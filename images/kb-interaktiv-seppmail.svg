  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#26748f"/></marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#987126"/></marker>
    <marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b8791"/></marker>
  </defs>

  <rect class="bg" width="1400" height="1000"/>
  <text class="kicker" x="70" y="52">SEPPMAIL · SMTP · POLICY · SCHLÜSSEL · RECOVERY</text>
  <text class="headline" x="70" y="88">Eine Nachricht durchläuft mehrere getrennte Vertrauens- und Zustandsräume</text>

  <rect class="panel" x="58" y="118" width="1284" height="290" rx="24"/>
  <text class="section" x="82" y="152">1 · INLINE-MAILFLUSS · TCP-ERREICHBARKEIT IST NOCH KEINE VERARBEITUNG</text>

