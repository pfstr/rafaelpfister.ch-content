  <title id="title">Paperless-ngx: Dokumentpipeline, Zustände und Recovery</title><desc id="desc">Interaktive Adminübersicht mit 28 verlinkten Blöcken für Eingänge, Consumer, Broker, Parser, OCR, Persistenz, Suche, Webserver, Datenbank, Dateien, Berechtigungen, Export, Restore und End-to-End-Abnahme.</desc>
