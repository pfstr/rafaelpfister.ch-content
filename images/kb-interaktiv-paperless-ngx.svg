  <path class="arrow" d="M138 836H1261"/><text class="t note" x="50" y="875">Inventar → konsistenter Snapshot/Export → isolierter Restore → Suche/Sanity → neuer Consume-Lauf.</text><text class="t note" x="50" y="910">Ein startender Container ist noch kein Restore; Original, Metadaten, Rechte und Pipeline müssen zusammen funktionieren.</text>
  <text class="t note" x="40" y="978">Interaktive Infografik · Primärdokumentation und vertiefende KB-Abschnitte öffnen sich per Klick oder Tastaturfokus.</text>
