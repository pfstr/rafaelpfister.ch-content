<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">SPF-, DKIM- und DMARC-Auswertung mit Identitäten und Trust Boundary</title>
  <desc id="desc">Interaktive Administrationsgrafik vom SMTP-Eingang über SPF- und DKIM-Prüfung, Alignment und DMARC-Policy bis zu Authentication-Results und Reports. Alle fachlichen Blöcke und Quellen sind verlinkt.</desc>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171717; }
    .bg { fill: #f8f5ef; }
    .panel { fill: #fffdfa; stroke: #d8d2c8; stroke-width: 2; }
    .hit { fill: #eef5f6; stroke: #26748f; stroke-width: 2; transition: fill .16s ease, stroke .16s ease, filter .16s ease; }
    .hit.gold { fill: #f8f1df; stroke: #a77a1f; }
    .hit.red { fill: #f8efec; stroke: #984a35; }
    .hit.green { fill: #eef5ef; stroke: #4f7a59; }
    .hit.violet { fill: #f3eff7; stroke: #765f89; }
    a:hover .hit, a:focus .hit { fill: #d2e9ee; stroke: #0d5872; filter: drop-shadow(0 5px 7px rgba(23, 69, 84, .22)); }
    a:hover .hit.gold, a:focus .hit.gold { fill: #f2dfad; stroke: #7c5811; }
    a:hover .hit.red, a:focus .hit.red { fill: #f2d8cf; stroke: #743321; }
    a:hover .hit.green, a:focus .hit.green { fill: #dbeadf; stroke: #315f3c; }
    a:hover .hit.violet, a:focus .hit.violet { fill: #e5d9ed; stroke: #59436c; }
    a:focus { outline: none; }
    .kicker { font-size: 15px; font-weight: 750; letter-spacing: 2.1px; fill: #6f697e; }
    .title { font-size: 30px; font-weight: 780; }
    .section { font-size: 15px; font-weight: 780; letter-spacing: 1.8px; fill: #6f697e; }
    .box-title { font-size: 17px; font-weight: 760; }
    .box-copy { font-size: 13px; fill: #4f4a55; }
    .mono { font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace; font-size: 13px; font-weight: 680; }
    .tiny { font-size: 11px; fill: #6b6574; }
    .chip { fill: #f2eee7; stroke: #d3ccc1; stroke-width: 1.4; transition: fill .16s ease, stroke .16s ease; }
    a:hover .chip, a:focus .chip { fill: #d9ebef; stroke: #26748f; }
    .arrow { fill: none; stroke: #26748f; stroke-width: 3; marker-end: url(#arrow); }
    .arrow-gold { fill: none; stroke: #a77a1f; stroke-width: 3; marker-end: url(#arrowGold); }
    .dash { fill: none; stroke: #8e8996; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrowMuted); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26748f"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77a1f"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8e8996"/></marker>
  </defs>

  <rect class="bg" width="1400" height="1000"/>
  <text class="kicker" x="70" y="45">MAIL-AUTHENTIFIZIERUNG · IDENTITÄTEN · ALIGNMENT · VERTRAUEN</text>
  <text class="title" x="70" y="80">Vom SMTP-Hop zum DMARC-Resultat: Was wurde wirklich bewiesen?</text>

  <rect class="panel" x="60" y="110" width="1280" height="210" rx="20"/>
  <text class="section" x="85" y="145">1 · VIER EINGABEN AUS DREI TECHNISCHEN EBENEN</text>

  <a href="/kb/smtp#envelope-und-nachrichteninhalt" target="_top" tabindex="0" aria-label="Client-IP · HELO – TCP-/SMTP-Hop am Border-MTA – SPF-Eingabe">
    <rect class="hit" x="85" y="170" width="255" height="112" rx="16"/>
    <text class="box-title" x="108" y="202">Client-IP · HELO</text>
    <text class="box-copy" x="108" y="229">TCP-/SMTP-Hop am Border-MTA</text>
    <text class="mono" x="108" y="257">SPF-Eingabe</text>
  </a>
  <a href="/kb/mail-auth#spf-autorisierung-der-verbindenden-ip" target="_top" tabindex="0" aria-label="RFC5321.MailFrom – Envelope · Return Path – SPF-Domain">
    <rect class="hit gold" x="385" y="170" width="255" height="112" rx="16"/>
    <text class="box-title" x="408" y="202">RFC5321.MailFrom</text>
    <text class="box-copy" x="408" y="229">Envelope · Return Path</text>
    <text class="mono" x="408" y="257">SPF-Domain</text>
  </a>
  <a href="/kb/mail-auth#dkim-signatur-einer-domain" target="_top" tabindex="0" aria-label="DKIM d= · s= – Signing Domain · Selektor – Signatur + DNS-Key">
    <rect class="hit violet" x="685" y="170" width="255" height="112" rx="16"/>
    <text class="box-title" x="708" y="202">DKIM d= · s=</text>
    <text class="box-copy" x="708" y="229">Signing Domain · Selektor</text>
    <text class="mono" x="708" y="257">Signatur + DNS-Key</text>
  </a>
  <a href="/kb/mail-auth#dmarc-alignment-policy-und-auswertung" target="_top" tabindex="0" aria-label="RFC5322.From – sichtbare Author Domain – DMARC-Vergleichsziel">
    <rect class="hit red" x="985" y="170" width="330" height="112" rx="16"/>
    <text class="box-title" x="1008" y="202">RFC5322.From</text>
    <text class="box-copy" x="1008" y="229">sichtbare Author Domain</text>
    <text class="mono" x="1008" y="257">DMARC-Vergleichsziel</text>
  </a>

  <rect class="panel" x="60" y="340" width="1280" height="315" rx="20"/>
  <text class="section" x="85" y="375">2 · EMPFÄNGERPIPELINE · ROHRESULTAT UND ALIGNMENT GETRENNT HALTEN</text>

  <a href="/kb/mail-auth#lookup-budget-und-abhängigkeiten" target="_top" tabindex="0" aria-label="SPF auswerten – IP + MailFrom/HELO + DNS – pass / fail / error">
    <rect class="hit gold" x="85" y="405" width="270" height="125" rx="16"/>
    <text class="box-title" x="110" y="438">SPF auswerten</text>
    <text class="box-copy" x="110" y="466">IP + MailFrom/HELO + DNS</text>
    <text class="mono" x="110" y="494">pass / fail / error</text>
  </a>
  <a href="/kb/mail-auth#schlüssel-algorithmen-und-rotation" target="_top" tabindex="0" aria-label="DKIM verifizieren – Header · Body · DNS-Key">
    <rect class="hit violet" x="85" y="550" width="270" height="75" rx="16"/>
    <text class="box-title" x="110" y="582">DKIM verifizieren</text>
    <text class="mono" x="110" y="606">Header · Body · DNS-Key</text>
  </a>

  <path class="arrow" d="M 355 468 H 440"/>
  <path class="arrow" d="M 355 587 H 440"/>

  <a href="/kb/mail-auth#dmarc-alignment-policy-und-auswertung" target="_top" tabindex="0" aria-label="Alignment je Mechanismus – SPF-Domain ↔ Author Domain – DKIM d= ↔ Author Domain">
    <rect class="hit" x="445" y="405" width="300" height="220" rx="18"/>
    <text class="box-title" x="475" y="440">Alignment je Mechanismus</text>
    <text class="box-copy" x="475" y="472">SPF-Domain ↔ Author Domain</text>
    <text class="box-copy" x="475" y="499">DKIM d= ↔ Author Domain</text>
    <line x1="475" y1="518" x2="715" y2="518" stroke="#a9a3ad"/>
    <text class="mono" x="475" y="548">strict = identisch</text>
    <text class="mono" x="475" y="576">relaxed = gleiche</text>
    <text class="mono" x="475" y="599">Organizational Domain</text>
  </a>

  <path class="arrow-gold" d="M 745 515 H 825"/>
  <a href="/kb/mail-auth#policy-record-und-tags" target="_top" tabindex="0" aria-label="DMARC – SPF aligned pass – ODER">
    <rect class="hit red" x="830" y="405" width="230" height="220" rx="18"/>
    <text class="box-title" x="860" y="440">DMARC</text>
    <text class="mono" x="860" y="474">SPF aligned pass</text>
    <text class="mono" x="860" y="500">ODER</text>
    <text class="mono" x="860" y="526">DKIM aligned pass</text>
    <line x1="860" y1="548" x2="1030" y2="548" stroke="#b28b80"/>
    <text class="box-copy" x="860" y="578">sonst Policy:</text>
    <text class="mono" x="860" y="604">none · quarantine · reject</text>
  </a>

  <path class="arrow" d="M 1060 478 H 1125"/>
  <path class="arrow-gold" d="M 1060 568 H 1125"/>
  <a href="/kb/mail-auth#authentication-results-richtig-vertrauen" target="_top" tabindex="0" aria-label="Auth-Results – nur innerhalb – Trust Boundary">
    <rect class="hit green" x="1130" y="405" width="185" height="95" rx="16"/>
    <text class="box-title" x="1152" y="438">Auth-Results</text>
    <text class="box-copy" x="1152" y="466">nur innerhalb</text>
    <text class="mono" x="1152" y="488">Trust Boundary</text>
  </a>
  <a href="/kb/mail-auth#reporting-als-betriebliche-datenpipeline" target="_top" tabindex="0" aria-label="Reports – XML/GZIP · RUA – Zeitreihe ≠ Einzelfall">
    <rect class="hit green" x="1130" y="525" width="185" height="100" rx="16"/>
    <text class="box-title" x="1152" y="558">Reports</text>
    <text class="box-copy" x="1152" y="584">XML/GZIP · RUA</text>
    <text class="mono" x="1152" y="608">Zeitreihe ≠ Einzelfall</text>
  </a>

  <rect class="panel" x="60" y="675" width="1280" height="175" rx="20"/>
  <text class="section" x="85" y="710">3 · INDIREKTE FLÜSSE · KEIN MECHANISMUS ÜBERLEBT JEDE MUTATION</text>
  <a href="/kb/mail-auth#weiterleitung-und-spf-domain" target="_top" tabindex="0" aria-label="Forwarder – neue Client-IP → SPF kann brechen">
    <rect class="hit gold" x="85" y="735" width="300" height="82" rx="15"/>
    <text class="box-title" x="108" y="766">Forwarder</text>
    <text class="box-copy" x="108" y="794">neue Client-IP → SPF kann brechen</text>
  </a>
  <a href="/kb/mail-auth#indirekte-flüsse-und-typische-bruchstellen" target="_top" tabindex="0" aria-label="Mailingliste / Gateway – Body/Header geändert → DKIM kann brechen">
    <rect class="hit violet" x="420" y="735" width="300" height="82" rx="15"/>
    <text class="box-title" x="443" y="766">Mailingliste / Gateway</text>
    <text class="box-copy" x="443" y="794">Body/Header geändert → DKIM kann brechen</text>
  </a>
  <a href="https://datatracker.ietf.org/doc/html/rfc8617" rel="noopener noreferrer" tabindex="0" aria-label="ARC · experimentell – signierter Kontext, kein Freipass" target="_top">
    <rect class="hit" x="755" y="735" width="265" height="82" rx="15"/>
    <text class="box-title" x="778" y="766">ARC · experimentell</text>
    <text class="box-copy" x="778" y="794">signierter Kontext, kein Freipass</text>
  </a>
  <a href="/kb/mail-auth#fehler-systematisch-einer-grenze-zuordnen" target="_top" tabindex="0" aria-label="Admin-Beweiskette – Hop · Domain · Resultat · Mutation">
    <rect class="hit green" x="1055" y="735" width="260" height="82" rx="15"/>
    <text class="box-title" x="1078" y="766">Admin-Beweiskette</text>
    <text class="box-copy" x="1078" y="794">Hop · Domain · Resultat · Mutation</text>
  </a>

  <text class="section" x="70" y="885">PRIMÄRQUELLEN · DETAILS UND GRENZEN</text>
  <a href="https://datatracker.ietf.org/doc/html/rfc7208" rel="noopener noreferrer" tabindex="0" aria-label="RFC 7208 · SPF" target="_top">
    <rect class="chip" x="70" y="905" width="215" height="48" rx="22"/><text class="tiny" x="177" y="934" text-anchor="middle">RFC 7208 · SPF</text>
  </a>
  <a href="https://datatracker.ietf.org/doc/html/rfc6376" rel="noopener noreferrer" tabindex="0" aria-label="RFC 6376 · DKIM" target="_top">
    <rect class="chip" x="305" y="905" width="215" height="48" rx="22"/><text class="tiny" x="412" y="934" text-anchor="middle">RFC 6376 · DKIM</text>
  </a>
  <a href="https://datatracker.ietf.org/doc/html/rfc9989" rel="noopener noreferrer" tabindex="0" aria-label="RFC 9989 · DMARC" target="_top">
    <rect class="chip" x="540" y="905" width="215" height="48" rx="22"/><text class="tiny" x="647" y="934" text-anchor="middle">RFC 9989 · DMARC</text>
  </a>
  <a href="https://datatracker.ietf.org/doc/html/rfc9990" rel="noopener noreferrer" tabindex="0" aria-label="RFC 9990 · Aggregate Reports" target="_top">
    <rect class="chip" x="775" y="905" width="245" height="48" rx="22"/><text class="tiny" x="897" y="934" text-anchor="middle">RFC 9990 · Aggregate Reports</text>
  </a>
  <a href="https://datatracker.ietf.org/doc/html/rfc8601" rel="noopener noreferrer" tabindex="0" aria-label="RFC 8601 · Authentication-Results" target="_top">
    <rect class="chip" x="1040" y="905" width="290" height="48" rx="22"/><text class="tiny" x="1185" y="934" text-anchor="middle">RFC 8601 · Authentication-Results</text>
  </a>

  <text class="tiny" x="70" y="980">Fokus oder Hover hebt jedes Ziel hervor. Interne Ziele öffnen die passende Admin-Erklärung; RFC-Chips führen zur Primärquelle.</text>
</svg>
