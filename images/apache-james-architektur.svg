  <title id="title">Technische Architektur von Apache James</title>
  <desc id="desc">Datenfluss von den Protokoll-Frontends über MailQueue, Spooler und Mailet-Container zur lokalen oder entfernten Zustellung sowie Mailbox API, Ereignisbus, Suche und Administration.</desc>
