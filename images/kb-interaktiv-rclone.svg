  <title id="title">Rclone-Datenpfad, Backendfähigkeiten und Recovery</title><desc id="desc">Interaktive Adminübersicht mit 28 verlinkten Blöcken für Quelle, Remote, Filter, Listing, Vergleich, Transfer, Providerfähigkeiten, Crypt, VFS, Bisync, RC, Logs, Exitcode, Check und Restore.</desc>
  <style>:root{color-scheme:light}.bg{fill:#faf8f4}.panel{fill:#fff;stroke:#d8d1c8;stroke-width:2}.head{fill:#f1ede7}.hit{fill:#edf5f7;stroke:#24738e;stroke-width:1.8;transition:fill .16s ease,stroke .16s ease}.hit.cap{fill:#f7f1ec;stroke:#8b3518}.hit.layer{fill:#f2f5ea;stroke:#55743a}.hit.ops{fill:#f1eff8;stroke:#6752a1}.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#111827}.ey{font-size:16px;font-weight:700;letter-spacing:2px;fill:#687086}.h1{font-size:30px;font-weight:750}.h2{font-size:17px;font-weight:750;letter-spacing:1.2px}.label{font-size:15px;font-weight:750;text-anchor:middle}.sub{font-size:12px;text-anchor:middle;fill:#526673}.note{font-size:13px;fill:#65717a}.arrow{stroke:#7f8c93;stroke-width:2;fill:none;marker-end:url(#arr)}a{text-decoration:none;outline:none}a:hover .hit,a:focus .hit{fill:#d4edf5;stroke:#075f7d;stroke-width:3}a:hover .hit.cap,a:focus .hit.cap{fill:#f8dfd2;stroke:#7a270e}a:hover .hit.layer,a:focus .hit.layer{fill:#dfeccd;stroke:#365a1d}a:hover .hit.ops,a:focus .hit.ops{fill:#e2dcf7;stroke:#4c3789}a:focus .hit{filter:url(#focus)}.pill{fill:#1f6f89}.pilltext{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}</style>
