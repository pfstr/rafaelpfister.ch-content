  <title id="title">Container-Stack, Isolationsgrenzen und Betriebszustand</title>
  <desc id="desc">Interaktive Adminübersicht über OCI-Artefakt, Engine, Runtime, Kernelisolation, Netzwerk, Storage, Sicherheit, Rollout und Recovery. Jeder Baustein ist verlinkt.</desc>
