  <text class="t h1" x="40" y="76">Container sind eine Schichtenkette, keine kleinen Server</text>
  <rect class="pill" x="1174" y="33" width="186" height="34" rx="17"/><text class="t pilltext" x="1267" y="55">28 VERLINKTE BLÖCKE</text>

