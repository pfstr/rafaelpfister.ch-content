<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Technisches Lizenzmodell von Entitlement bis Betriebsnachweis</title>
  <desc id="desc">Interaktive Übersicht von Vertrag und Entitlement, Software- und Assetinventar, Zuweisung und Nutzung, Lizenzmetriken, Lizenzdienst und Enforcement sowie HA-, DR-, Open-Source- und Auditgrenzen.</desc>
  <style>
    :root { color-scheme: light; }
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #101828; }
    .eyebrow { font-size: 16px; font-weight: 800; letter-spacing: 2px; fill: #667085; }
    .title { font-size: 30px; font-weight: 800; }
    .subtitle { font-size: 15px; fill: #475467; }
    .section { font-size: 15px; font-weight: 800; letter-spacing: 1.25px; fill: #667085; }
    .label { font-size: 17px; font-weight: 800; }
    .body { font-size: 13.5px; fill: #344054; }
    .small { font-size: 12px; fill: #475467; }
    .tiny { font-size: 11px; fill: #667085; }
    .frame { fill: #fff; stroke: #d8d2c8; stroke-width: 2; }
    .hit { fill: #f7f4ee; stroke: #cfc7ba; stroke-width: 2; transition: fill .18s ease, stroke .18s ease, transform .18s ease; transform-box: fill-box; transform-origin: center; }
    .hit-blue { fill: #e8f3f7; stroke: #28718c; }
    .hit-green { fill: #eaf5ef; stroke: #3b7d5b; }
    .hit-red { fill: #f8ece6; stroke: #8b3a1b; }
    .hit-violet { fill: #f0ebf7; stroke: #70558e; }
    .chip { fill: #f7f4ee; stroke: #cfc7ba; stroke-width: 1.5; transition: fill .18s ease, stroke .18s ease, transform .18s ease; transform-box: fill-box; transform-origin: center; }
    .arrow { stroke: #28718c; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .arrow-red { stroke: #8b3a1b; stroke-width: 2.5; fill: none; marker-end: url(#arrowRed); }
    a { cursor: pointer; outline: none; }
    a:hover .hit, a:focus .hit { fill: #d9edf4; stroke: #0d6a8a; transform: translateY(-3px); }
    a:hover .hit-green, a:focus .hit-green { fill: #d5ecdf; stroke: #246844; }
    a:hover .hit-red, a:focus .hit-red { fill: #f3d8cc; stroke: #7a2d12; }
    a:hover .hit-violet, a:focus .hit-violet { fill: #e3d8ef; stroke: #5c3e7e; }
    a:hover .chip, a:focus .chip { fill: #d9edf4; stroke: #0d6a8a; transform: translateY(-2px); }
    a:hover text, a:focus text { fill: #064c66; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#28718c"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b3a1b"/></marker>
  </defs>

  <rect width="1400" height="1000" fill="#fbfaf7"/>
  <text class="eyebrow" x="36" y="42">LIZENZIERUNG · ENTITLEMENT, ZÄHLPUNKT UND TECHNISCHER BETRIEB</text>
  <text class="title" x="36" y="82">Vertragsrecht, technische Zuweisung und Nutzung sind drei verschiedene Mengen</text>
  <text class="subtitle" x="36" y="110">Alle Blöcke sind klickbar und führen zum Artikelabschnitt, Werkzeug oder zur belegenden Primärquelle</text>

