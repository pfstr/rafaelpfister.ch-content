  <text x="454" y="438" font-size="10.5" font-weight="700" letter-spacing="1" fill="#7a2f16">BETRIEBLICHE ABLEITUNG</text>
  <text x="454" y="466" font-size="12" fill="#222">• relationales, bekanntes HA-/Backup-Modell</text>
  <text x="454" y="491" font-size="12" fill="#222">• klein beginnen, Komponenten gezielt ergänzen</text>
  <text x="454" y="516" font-size="12" fill="#222">• Custom Mailets auf Jakarta-Kompatibilität prüfen</text>
  <text x="454" y="541" font-size="12" fill="#222">• guter Standardpfad für neue Installationen</text>
  <line x1="454" y1="565" x2="808" y2="565" stroke="#d9d4cc"/>
  <text x="454" y="590" font-size="10.5" font-weight="700" fill="#286983">ENTSCHEIDUNGSREGEL</text>
  <text x="454" y="614" font-size="11.5" fill="#757087">Zusatzdienste erst einführen, wenn Last, Suche</text>
  <text x="454" y="636" font-size="11.5" fill="#757087">oder Verfügbarkeit sie nachweislich benötigen.</text>

