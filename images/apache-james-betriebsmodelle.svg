  <text x="876" y="438" font-size="10.5" font-weight="700" letter-spacing="1" fill="#7a2f16">BETRIEBLICHE ABLEITUNG</text>
  <text x="876" y="466" font-size="12" fill="#222">• jede Abhängigkeit ist eigene Fehlerdomäne</text>
  <text x="876" y="491" font-size="12" fill="#222">• Projektionen sind eventuell konsistent</text>
  <text x="876" y="516" font-size="12" fill="#222">• Dead Letters und Reindexierung einplanen</text>
  <text x="876" y="541" font-size="12" fill="#222">• Runbooks für Backend-Teilausfälle nötig</text>
  <line x1="876" y1="565" x2="1228" y2="565" stroke="#d9d4cc"/>
  <text x="876" y="590" font-size="10.5" font-weight="700" fill="#7a2f16">HAUPTRISIKO</text>
  <text x="876" y="614" font-size="11.5" fill="#757087">„James läuft“ bedeutet nicht, dass Queue, Index,</text>
  <text x="876" y="636" font-size="11.5" fill="#757087">Events und Blob-Speicher gemeinsam gesund sind.</text>

