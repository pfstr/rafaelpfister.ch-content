  <text x="52" y="438" font-size="10.5" font-weight="700" letter-spacing="1" fill="#7a2f16">BETRIEBLICHE ABLEITUNG</text>
  <text x="52" y="466" font-size="12" fill="#222">• wenige externe Komponenten</text>
  <text x="52" y="491" font-size="12" fill="#222">• Einzelknoten, vertikale Skalierung</text>
  <text x="52" y="516" font-size="12" fill="#222">• lokaler Index Teil des Backups</text>
  <text x="52" y="541" font-size="12" fill="#222">• einfacher Start, schwächerer Zukunftspfad</text>
  <line x1="52" y1="565" x2="386" y2="565" stroke="#d9d4cc"/>
  <text x="52" y="590" font-size="10.5" font-weight="700" fill="#7a2f16">HAUPTRISIKO</text>
  <text x="52" y="614" font-size="11.5" fill="#757087">Ein Knoten bündelt Laufzeit, Daten und Index.</text>
  <text x="52" y="636" font-size="11.5" fill="#757087">Restore muss diese Zustände gemeinsam treffen.</text>

